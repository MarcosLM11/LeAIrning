x-db-url: &db-url jdbc:postgresql://postgres:5432/fileservice

# Trazas, métricas y logs hacia Grafana (LGTM) por OTLP/HTTP.
x-otel: &otel
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://grafana:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://grafana:4318/v1/logs
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://grafana:4318/v1/metrics

services:
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data

  postgres:
    image: pgvector/pgvector:pg18
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - statement_timeout=30s
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_DB: fileservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fileservice"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "8085:8080"   # Kafka UI (8080 queda libre para los servicios)

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  grafana:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "3000:3000"   # Grafana UI (admin / admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - grafana-data:/data

  # --- Aplicación (solo gateway y frontend publican puerto) ---

  api-gateway:
    build: ./api-gateway
    restart: on-failure
    environment:
      <<: *otel
      AI_SERVICE_URL: http://ai-service:8081
      FILE_SERVICE_URL: http://file-service:8082
      USER_SERVICE_URL: http://user-service:8086
    ports:
      - "8080:8080"

  ai-service:
    build: ./ai-service
    restart: on-failure
    environment:
      <<: *otel
      SPRING_DATASOURCE_URL: *db-url
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  file-service:
    build: ./file-service
    restart: on-failure
    environment:
      <<: *otel
      SPRING_DATASOURCE_URL: *db-url
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      s3: { condition: service_started }

  ingestion-service:
    build: ./ingestion-service
    restart: on-failure
    environment:
      <<: *otel
      SPRING_DATASOURCE_URL: *db-url
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_ENDPOINT: http://s3:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      s3: { condition: service_started }

  notification-service:
    build: ./notification-service
    restart: on-failure
    environment:
      <<: *otel
      SPRING_DATASOURCE_URL: *db-url
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_MAIL_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      mailpit: { condition: service_started }

  user-service:
    build: ./user-service
    restart: on-failure
    environment:
      <<: *otel
      SPRING_DATASOURCE_URL: *db-url
      S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }

  frontend:
    build: ./frontend
    ports:
      - "5173:80"

volumes:
  s3-data:
  pg-data:
  grafana-data:
  kafka-data:
