server:
  port: 8086

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/fileservice
    username: postgres
    password: postgres
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
        socketTimeout: 30
        ApplicationName: user-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: files

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32b}
