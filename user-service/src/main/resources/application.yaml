server:
  port: 8086

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/fileservice
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32b}
