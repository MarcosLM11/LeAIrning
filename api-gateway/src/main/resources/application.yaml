server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/chat/**, /api/v1/quizzes/**
            - id: file-service
              uri: ${FILE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/files/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32b}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
