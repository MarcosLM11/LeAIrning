server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ai-service
              uri: http://localhost:8081
              predicates:
                - Path=/chat/**, /quizz/**
            - id: file-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/files/**

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
