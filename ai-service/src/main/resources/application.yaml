server:
  port: 8081

spring:
  application:
    name: ai-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/fileservice
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.marcos.aiservice.quizz.QuizzRequestedEvent
        spring.json.use.type.headers: false
        # shortcut: a quizz can take minutes to generate, so allow 30 min between polls; use a real job queue if it needs more.
        max.poll.interval.ms: 1800000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano
          reasoning-effort: minimal
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        dimensions: 1536
    session:
      repository:
        jdbc:
          initialize-schema: always

quizz:
  model: gpt-5-mini
  reasoning-effort: low

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32b}
