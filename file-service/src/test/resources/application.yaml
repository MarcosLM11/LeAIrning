spring:
  application:
    name: file-service
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
    logging:
      export:
        enabled: false

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: files

jwt:
  secret: test-secret-test-secret-test-secret-1
