server:
  port: 8082
  compression:
    enabled: true

spring:
  application:
    name: file-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/fileservice
    username: postgres
    password: postgres
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
        socketTimeout: 30
        ApplicationName: file-service
  kafka:
    consumer:
      group-id: file-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.marcos.fileservice.FileIngestedEvent
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  flyway:
    table: flyway_schema_history_file
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        log_slow_query: 500
        generate_statistics: true
        query:
          fail_on_pagination_over_collection_fetch: true

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: files

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32b}
