server:
  port: 8082

spring:
  application:
    name: file-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/fileservice
    username: postgres
    password: postgres
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  jpa:
    open-in-view: false
    hibernate:
      # shortcut: auto schema updates, switch to Flyway/Liquibase before production data matters.
      ddl-auto: update

s3:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: files

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-32b}
