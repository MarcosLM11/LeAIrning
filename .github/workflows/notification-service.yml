name: notification-service CI

on:
  push:
    paths: [notification-service/**, .github/workflows/notification-service.yml]
  pull_request:
    paths: [notification-service/**, .github/workflows/notification-service.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 27
          cache: maven
          cache-dependency-path: notification-service/pom.xml
      - run: ./mvnw -B verify
