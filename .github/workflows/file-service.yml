name: file-service CI

on:
  push:
    paths: [file-service/**, .github/workflows/file-service.yml]
  pull_request:
    paths: [file-service/**, .github/workflows/file-service.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: file-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 27
          cache: maven
          cache-dependency-path: file-service/pom.xml
      - run: ./mvnw -B verify
